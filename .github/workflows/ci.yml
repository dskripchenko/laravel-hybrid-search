name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    # PostgreSQL with pgvector: the full-text suite and the vector suite run
    # against it (the tests install `vector` into the schema `extensions`).
    # The image's default locale is en_US.utf8, which the migration needs.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hybrid_search_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11', '12', '13']
        exclude:
          - php: '8.2'
            laravel: '13'
        include:
          - laravel: '11'
            testbench: '^9.0'
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'

    env:
      HYBRID_SEARCH_TEST_DB_HOST: 127.0.0.1
      HYBRID_SEARCH_TEST_DB_PORT: '5432'
      HYBRID_SEARCH_TEST_DB_DATABASE: hybrid_search_test
      HYBRID_SEARCH_TEST_DB_USERNAME: postgres
      HYBRID_SEARCH_TEST_DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_pgsql
          coverage: none

      # testbench major maps 1:1 to Laravel major (9→11, 10→12, 11→13).
      - name: Pin Testbench
        run: composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction

      # Laravel 11 is past its security-fix window; allow resolving it anyway.
      - name: Allow EOL framework resolution (Laravel 11 only)
        if: matrix.laravel == '11'
        run: composer config policy.advisories.block false

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # The Ollama test skips itself: no embeddings endpoint in CI.
      - name: Pest
        run: vendor/bin/pest
